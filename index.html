<!DOCTYPE html>
<html>
  <head>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
    <title>Todo App</title>
  </head>
  <body class="body">
    <header class="header">
      <img src="./eisenhower-matrix.jpg" alt="eisenhower matrix" class="header__img">
      <a class="header__link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </header>
    <main class="main">
      <section class="section">
        <h1 class="section__title section__title_type_add">Add Item</h1>
        <div class="add">
          <input class="add__input" type="text">
          <button class="button">Add</button>
        </div>
      </section>
      <section class="section">
        <h2 class="section__title">Todo</h2>
        <ul class="list list_type_incompleted">
          <li class="item">
            <input type="checkbox" class="item__checkbox">
            <span class="item__span">Pay Bills</span>
            <input type="text" class="item__input">
            <button class="button item__edit-save">Edit</button>
            <button class="button item__delete"><img src="./remove.svg" alt="remove icon"></button>
          </li>
          <li class="item item_edit">
            <input type="checkbox" class="item__checkbox">
            <span class="item__span">Go Shopping</span>
            <input type="text" value="Go Shopping" class="item__input">
            <button class="button item__edit-save">Save</button>
            <button class="button item__delete"><img src="./remove.svg" alt="remove icon"></button>
          </li>
        </ul>
      </section>
      <section class="section">
        <h2 class="section__title">Completed</h2>
        <ul class="list list_type_completed">
          <li class="item">
            <input type="checkbox" checked class="item__checkbox">
            <span class="item__span">See the Doctor</span>
            <input type="text" class="item__input">
            <button class="button item__edit-save">Edit</button>
            <button class="button item__delete"><img src="./remove.svg" alt="remove icon"></button>
          </li>
        </ul>
      </section>
      </main>
      <script src="app.js"></script>
  </body>
</html>
